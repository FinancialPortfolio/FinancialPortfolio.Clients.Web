<div *ngIf="accounts.length > 0; else emptyTable">
    <div class="table-header">
        <h2 class="table-header-text">Accounts</h2>
    </div>

    <table mat-table [dataSource]="accounts" class="mat-elevation-z8">
        <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>

        <ng-container matColumnDef="createdDateTime">
            <th mat-header-cell *matHeaderCellDef> Created </th>
            <td mat-cell *matCellDef="let element"> {{element.createdDateTime}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-header-cell"> Actions </th>
            <td mat-cell *matCellDef="let element" class="action-cell">
                <button mat-raised-button (click)="edit(element)">Edit</button>
                <button mat-raised-button (click)="delete(element)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>

<ng-template #emptyTable>
    <h2 class="mt-3 text-center mat-h2">You don't have any accounts yet</h2>
</ng-template>

<div class="d-flex edit-buttons justify-content-end">
    <button mat-raised-button (click)="add()">Add New</button>
</div>
