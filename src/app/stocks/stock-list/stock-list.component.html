<div *ngIf="stocks.length > 0; else emptyTable">
    <table mat-table [dataSource]="stocks" matSort (matSortChange)="sort($event)" matSortDisableClear="true" class="mat-elevation-z8">
        <ng-container matColumnDef="position">
            <th mat-header-cell mat-sort-header="position" *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell mat-sort-header="Amount" *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="symbol">
            <th mat-header-cell mat-sort-header="DateTime" *matHeaderCellDef> Symbol </th>
            <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 50]" [length]="totalSize"
        [pageIndex]="pageNumber" (page)="paginate($event)">
    </mat-paginator>
</div>

<ng-template #emptyTable>
    <h2 class="mt-3 text-center mat-h2">You don't have any stocks yet</h2>
</ng-template>
