<div *ngIf="transfers.length > 0; else emptyTable">
    <div class="list-header">
        <h2 class="list-header-text">Transfers</h2>
    </div>

    <div class="mat-elevation-z4">
        <table mat-table [dataSource]="transfers" matSort (matSortChange)="sort($event)" matSortDisableClear="true">
            <ng-container matColumnDef="position">
                <th mat-header-cell mat-sort-header="position" *matHeaderCellDef> No. </th>
                <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                <td mat-footer-cell *matFooterCellDef></td>
            </ng-container>

            <ng-container matColumnDef="amount">
                <th mat-header-cell mat-sort-header="Amount" *matHeaderCellDef> Amount </th>
                <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
                <td mat-footer-cell *matFooterCellDef class="bold"> {{ totalTransfers | number: '1.0-2' }} </td>
                <td mat-footer-cell *matFooterCellDef></td>
            </ng-container>

            <ng-container matColumnDef="dateTime">
                <th mat-header-cell mat-sort-header="DateTime" *matHeaderCellDef> Date </th>
                <td mat-cell *matCellDef="let element"> {{element.dateTime | date: 'dd/MM/yyyy HH:mm'}} </td>
                <td mat-footer-cell *matFooterCellDef></td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell mat-sort-header="Type" *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let element"> {{element.type}} </td>
                <td mat-footer-cell *matFooterCellDef></td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="actions-header-cell"> Actions </th>
                <td mat-cell *matCellDef="let element" class="action-cell">
                    <button mat-raised-button (click)="edit(element)">Edit</button>
                    <button mat-raised-button (click)="delete(element)">Delete</button>
                </td>
                <td mat-footer-cell *matFooterCellDef></td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
        </table>

        <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25]" [length]="totalSize"
            [pageIndex]="pageNumber" (page)="paginate($event)">
        </mat-paginator>
    </div>
</div>

<ng-template #emptyTable>
    <h2 class="mt-3 text-center mat-h2">You don't have any transfers yet</h2>
</ng-template>

<div class="d-flex edit-buttons justify-content-end">
    <button mat-raised-button (click)="add()">Add New</button>
</div>
