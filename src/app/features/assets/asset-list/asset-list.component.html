<div>
    <div class="list-header">
        <h2 class="list-header-text">Assets</h2>

        <div class="list-filter">
            <mat-form-field class="filter-form-field">
                <input matInput placeholder="Name" [(ngModel)]="name" (change)="loadAssets()">
            </mat-form-field>
            <mat-form-field class="filter-form-field">
                <input matInput placeholder="Symbol" [(ngModel)]="symbol" (change)="loadAssets()">
            </mat-form-field>
            <mat-form-field class="filter-form-field">
                <mat-select placeholder="Type" [(ngModel)]="type" (selectionChange)="loadAssets()">
                    <mat-option value="">*</mat-option>
                    <mat-option value="IndexFund">Index funds</mat-option>
                    <mat-option value="Stock">Stocks</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <div class="mat-elevation-z4">
        <table mat-table [dataSource]="assets" matSort (matSortChange)="sort($event)" matSortDisableClear="true">
            <ng-container matColumnDef="position">
                <th mat-header-cell mat-sort-header="position" *matHeaderCellDef> No. </th>
                <td mat-cell *matCellDef="let element"> {{element.position}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell mat-sort-header="Name" *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="symbol">
                <th mat-header-cell mat-sort-header="Symbol" *matHeaderCellDef> Symbol </th>
                <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
            </ng-container>

            <ng-container matColumnDef="exchange">
                <th mat-header-cell mat-sort-header="Exchange" *matHeaderCellDef class="exchange-cell-header"> Exchange </th>
                <td mat-cell *matCellDef="let element" class="exchange-cell"> {{element.exchange}} </td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell mat-sort-header="Type" *matHeaderCellDef class="type-cell-header"> Type </th>
                <td mat-cell *matCellDef="let element" class="type-cell"> {{element.type}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 50]" [length]="totalSize"
            [pageIndex]="pageNumber" (page)="paginate($event)">
        </mat-paginator>
    </div>
</div>
