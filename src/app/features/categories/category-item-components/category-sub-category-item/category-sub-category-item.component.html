<div class="categories-block mat-elevation-z4">
    <table mat-table [dataSource]="subCategoriesDataSource" matSort matSortActive="allocation" matSortDirection="desc" matSortDisableClear (matSortChange)="sortSubCategories($event)">
        <ng-container matColumnDef="name">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>

        <ng-container matColumnDef="allocation">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Allocation </th>
            <td mat-cell *matCellDef="let element"> {{element.allocation | number: '1.0-2'}} </td>
        </ng-container>

        <ng-container matColumnDef="allocationInPercentage">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Allocation % </th>
            <td mat-cell *matCellDef="let element"> {{element.allocationInPercentage | number: '1.0-2'}}%</td>
        </ng-container>

        <ng-container matColumnDef="expectedAllocationInPercentage" *ngIf="!isUncategorizedCategory">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Expected Allocation % </th>
            <td mat-cell *matCellDef="let element"> {{element.expectedAllocationInPercentage | number: '1.0-2'}}% </td>
        </ng-container>

        <ng-container matColumnDef="actions" *ngIf="!isUncategorizedCategory">
            <th mat-header-cell *matHeaderCellDef class="actions-header-cell"> Actions </th>
            <td mat-cell *matCellDef="let element" class="action-cell">
                <button mat-raised-button (click)="editSubCategory(element, $event)">Edit</button>
                <button mat-raised-button (click)="deleteSubCategory(element, $event)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="categoriesDisplayedColumns"></tr>
        <tr mat-row class="sub-category-row" *matRowDef="let row; columns: categoriesDisplayedColumns;" (click)="onSelect(row)"></tr>
    </table>
</div>
