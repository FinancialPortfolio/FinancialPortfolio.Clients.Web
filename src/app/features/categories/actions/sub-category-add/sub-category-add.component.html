<h2 mat-dialog-title>Add sub-category</h2>

<mat-dialog-content class="mat-typography add-form">
    <form (ngSubmit)="onSave()" [formGroup]="categoryForm">
        <mat-form-field>
            <input matInput placeholder="Name" formControlName="name" required>
        </mat-form-field>

        <mat-form-field>
            <input matInput placeholder="Description" formControlName="description" required>
        </mat-form-field>

        <mat-form-field>
            <input matInput placeholder="Expected allocation" formControlName="expectedAllocationInPercentage" required>
        </mat-form-field>

        <input type="submit" hidden />
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close>Close</button>
    <button mat-button type="submit" (click)="onSave()" [disabled]="categoryForm.invalid">Save</button>
</mat-dialog-actions>
