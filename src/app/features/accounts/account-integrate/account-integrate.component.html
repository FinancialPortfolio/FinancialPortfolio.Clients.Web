<h2 mat-dialog-title>Integrate</h2>

<mat-dialog-content class="mat-typography edit-form">
    <form (ngSubmit)="onSave()" [formGroup]="integrationForm">
        <mat-form-field appearance="standard">
            <mat-label>Source</mat-label>
            <mat-select formControlName="source" (selectionChange)="onSourceChange()">
                <mat-option value="AdmiralMarkets">Admiral Markets</mat-option>
                <mat-option value="InteractiveBrokers">Interactive Brokers</mat-option>
            </mat-select>
        </mat-form-field>

        <div class="report-form-group">
            <button type="button" mat-raised-button (click)="fileInput.click()">Choose Report</button>
            <input hidden #fileInput type="file" formControlName="file" (change)="onFileChange($event)">
            <label class="file-name">{{file?.name}}</label>
        </div>

        <input type="submit" hidden />
    </form>

    <div *ngIf="invalidOrders.length > 0" class="invalid-orders-table">
        <span class="title">Stocks for orders don't exist. Those orders won't be integrated.</span>
        <table mat-table [dataSource]="invalidOrders" class="mat-elevation-z4">
            <ng-container matColumnDef="dateTime">
                <th mat-header-cell *matHeaderCellDef> DateTime </th>
                <td mat-cell *matCellDef="let element"> {{element.dateTime}} </td>
            </ng-container>

            <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef> Amount </th>
                <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
            </ng-container>

            <ng-container matColumnDef="symbol">
                <th mat-header-cell *matHeaderCellDef> Symbol </th>
                <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
            </ng-container>

            <ng-container matColumnDef="exchange">
                <th mat-header-cell *matHeaderCellDef> Exchange </th>
                <td mat-cell *matCellDef="let element"> {{element.exchange}} </td>
            </ng-container>

            <ng-container matColumnDef="currency">
                <th mat-header-cell *matHeaderCellDef> Currency </th>
                <td mat-cell *matCellDef="let element"> {{element.currency}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close>Close</button>
    <button mat-button type="submit" (click)="onSave()" [disabled]="integrationForm.invalid">Save</button>
</mat-dialog-actions>
