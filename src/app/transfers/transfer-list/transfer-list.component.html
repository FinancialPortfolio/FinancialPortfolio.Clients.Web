<table mat-table [dataSource]="transfers" class="mat-elevation-z8" *ngIf="transfers.length > 0; else emptyTable">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>
  
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef> Amount </th>
      <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
    </ng-container>
  
    <ng-container matColumnDef="dateTime">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let element"> {{element.dateTime}} </td>
    </ng-container>
  
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Type </th>
      <td mat-cell *matCellDef="let element"> {{element.type}} </td>
    </ng-container>
  
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="edit-header-cell"> Action </th>
      <td mat-cell *matCellDef="let element" class="edit-cell" (click)="edit(element)">
        <button mat-raised-button>Edit</button> 
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  
  <ng-template #emptyTable>
    <h2 class="mt-3 text-center mat-h2">You don't have any transfers yet</h2>
  </ng-template>
  
  <div class="d-flex edit-buttons justify-content-end">
    <button mat-raised-button (click)="add()">Add New</button>
  </div>
